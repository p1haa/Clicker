<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Clicker</title>
</head>
<body>
    <div id="moneyd">
        <h1 id="money">Money: 0$</h1>
        <h3 id="clickpower">Click power: 1$ per click</h3>
        <h3 id="autop">Autoclicker power: 0$ per second</h3>
        <button id="button">Click me</button>
        <button id="golden">$$$CLICK ME!!$$$</button>
    </div>
    <div id="upgradesdiv">
        <h2>UPGRADES</h2>
        <h4 id="upgradectext1">Cost: 10$</h4>
        <h3 id="broke">NOT ENOUGH MONEY</h3>
        <button id="upgrade1">+1 CLICK POWER</button>
        <h4 id="upgradectext10">Cost: 150$</h4>
        <button id="upgrade10">+10 CLICK POWER</button>
        <h4 id="autoctext">Cost: 50$</h4>
        <button id="autob">+1 AUTOCLICKER POWER</button>
    </div>

</body>
</html>
